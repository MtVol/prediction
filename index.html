<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Predicción de Cultivo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      margin-top: 40px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 850px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .model-btn {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      cursor: default;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }
    .rf {
      background: #28a745;
      color: white;
    }
    .svm {
      background: #ff9800;
      color: white;
    }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      margin-bottom: 5px;
      color: #444;
    }
    input, select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }
    input:focus, select:focus {
      border-color: #007bff;
    }
    .full-width {
      grid-column: span 2;
      display: flex;
      justify-content: center;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 30px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #222;
      padding: 15px;
      border-radius: 10px;
      background: #f1f9ff;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Formulario de Predicción</h1>

    <!-- Botón grande que cambia según el modelo -->
    <div id="modelIndicator" class="model-btn rf">
      Modelo seleccionado: RandomForest
    </div>

    <form id="predictionForm">
      <div class="form-group">
        <label for="model">Modelo</label>
        <select id="model" name="model" required>
          <option value="0" selected>RandomForest</option>
          <option value="1">SVM</option>
        </select>
      </div>
      <div class="form-group">
        <label for="N">N (int)</label>
        <input type="number" id="N" name="N" required>
      </div>
      <div class="form-group">
        <label for="P">P (int)</label>
        <input type="number" id="P" name="P" required>
      </div>
      <div class="form-group">
        <label for="K">K (int)</label>
        <input type="number" id="K" name="K" required>
      </div>
      <div class="form-group">
        <label for="temperature">Temperatura (float)</label>
        <input type="number" step="0.01" id="temperature" name="temperature" required>
      </div>
      <div class="form-group">
        <label for="humidity">Humedad (float)</label>
        <input type="number" step="0.01" id="humidity" name="humidity" required>
      </div>
      <div class="form-group">
        <label for="ph">pH (float)</label>
        <input type="number" step="0.01" id="ph" name="ph" required>
      </div>
      <div class="form-group">
        <label for="rainfall">Lluvia (float)</label>
        <input type="number" step="0.01" id="rainfall" name="rainfall" required>
      </div>
      <div class="full-width">
        <button type="submit">Prediccion</button>
      </div>
    </form>
    <div id="result" class="result"></div>
  </div>

  <script>
    const modelSelect = document.getElementById("model");
    const modelIndicator = document.getElementById("modelIndicator");

    // Cambiar color del botón grande según el modelo
    modelSelect.addEventListener("change", () => {
      if (modelSelect.value === "0") {
        modelIndicator.textContent = "Modelo seleccionado: RandomForest";
        modelIndicator.className = "model-btn rf";
      } else {
        modelIndicator.textContent = "Modelo seleccionado: SVM";
        modelIndicator.className = "model-btn svm";
      }
    });

    document.getElementById("predictionForm").addEventListener("submit", async function(e){
      e.preventDefault();

      const data = {
        model: parseInt(document.getElementById("model").value),
        N: parseInt(document.getElementById("N").value),
        P: parseInt(document.getElementById("P").value),
        K: parseInt(document.getElementById("K").value),
        temperature: parseFloat(document.getElementById("temperature").value),
        humidity: parseFloat(document.getElementById("humidity").value),
        ph: parseFloat(document.getElementById("ph").value),
        rainfall: parseFloat(document.getElementById("rainfall").value)
      };
      console.log(data.model);

      try {
        const response = await fetch("https://pyiot.onrender.com/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";
        resultDiv.textContent = "🌱 Predicción: " + result.prediction;
      } catch (error) {
        alert("Error al conectarse con el servidor: " + error);
      }
    });
  </script>
</body>
</html>
